name: Full stack integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    name: Playwright with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: loja_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loja_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NORD_API_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout frontend under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout public backend baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ezequieldesr/nord_backend
          ref: main
          path: .ci-backend
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Package backend baseline
        run: mvn -B -ntp -f .ci-backend/pom.xml -DskipTests package
      - run: pnpm build
      - name: Start local services and run all scenarios
        shell: bash
        run: |
          set -euo pipefail
          java -jar .ci-backend/target/nord-*.jar             --spring.profiles.active=dev --server.address=127.0.0.1             --spring.jpa.show-sql=false --debug=false --logging.level.root=WARN > /tmp/nord-api.log 2>&1 &
          api_pid=$!
          pnpm start --hostname 127.0.0.1 > /tmp/nord-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$api_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8080/api/produtos http://127.0.0.1:3000; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" > /dev/null; then ready=true; break; fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "Service did not start: $url"
              exit 1
            fi
          done
          pnpm test:e2e
      # Reports/traces can contain JWTs: do not upload them to public artifacts.
